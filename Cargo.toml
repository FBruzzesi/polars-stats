[package]
name = "polars-stats"
version = "0.0.2"
edition = "2021"
description = "Probability distributions as Polars expressions"
license = "MIT"
repository = "https://github.com/FBruzzesi/polars-stats"
publish = false # ships only as a cdylib inside the Python wheel, never to crates.io

[lib]
name = "polars_stats"
crate-type = ["cdylib"]

[features]
# `extension-module` tells pyo3 not to link libpython (the host interpreter provides the symbols at runtime).
# That is required for the wheel but breaks a standalone `cargo test` binary on Linux,
# so it is a default feature (enabled automatically by `maturin build`) that a local standalone `cargo build` / `cargo test` can turn off via `--no-default-features`.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-polars = { version = "0.28.0", features = ["derive", "dtype-array"] }
serde = { version = "1", features = ["derive"] }
# The narrow integer dtypes are enabled for correctness, not reach: a parameter column whose dtype
# this polars build lacks *panics* at the plugin boundary instead of raising.
polars = { version = "0.55.2", default-features = false, features = [
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
polars-arrow = { version = "0.55.2", default-features = false }
# Already in polars' tree; depended on directly for `runtime::RAYON` and its rayon re-export, so the
# multi-draw samplers parallelise on the same thread pool polars itself uses.
polars-core = { version = "0.55.2", default-features = false }
# Trim statrs to what this crate uses. `default-features = false` drops the optional `nalgebra` feature
# (and its matrixmultiply / num-complex / num-rational / num-integer subtree), which statrs pulls only for
# its multivariate distributions (MultivariateNormal, Dirichlet, ...) that this crate does not use.
# `std` must be re-enabled explicitly: statrs 0.19 supports `no_std` and carries `std` as a default
# feature, so switching defaults off without it silently builds a `no_std` statrs. `rand` is re-enabled
# explicitly too: the statrs-backed samplers (Normal, Bernoulli, Exponential, ...) draw via statrs's
# `rand::distr::Distribution` impl, so dropping it fails to compile. `nalgebra?/rand` inside statrs's
# `rand` feature is inert while `nalgebra` is off, so no nalgebra returns. Compile-only trim,
# identical output.
statrs = { version = "0.19.1", default-features = false, features = ["std", "rand"] }
rand = "0.10"
# The binomial sampler's seeded output depends on rand_distr's draw algorithm (BINV/BTPE, plus a
# Poisson approximation when `1 - p == 1.0`) and its per-draw uniform consumption: a bump can change
# it. The committed Cargo.lock pins the exact build version; treat any update as a deliberate,
# changelog-recorded seeded-output change.
rand_distr = "0.6"
rand_pcg = "0.10"

[profile.release]
lto = "thin"  # "fat" is more aggressive; see trade-off
codegen-units = 1
strip = true  # smaller wheel; drops debug symbols only

# TODO(FBruzzesi): Properly evaluate `lto="fat"` in terms of:
# - wheel size (compressed)
# - .so size (uncompressed)
# - performance
# - build time

---

name: Cache warmup

# Builds the release wheel on `main` for the sole purpose of populating the
# shared Rust build cache. GitHub Actions caches created on a base branch are
# restorable by PRs targeting it, so a fresh PR branch no longer compiles the
# full dependency tree (polars, pyo3, ...) from scratch.
#
# This is deliberately a separate workflow from `pull-request.yml`: merging to
# `main` should only warm the cache, not re-run the entire lint / typing / test
# matrix. The build steps mirror the `build` job in
# `pull-request.yml` exactly (toolchain, RUSTFLAGS, profile, python version) so
# the cached artifacts are byte-for-byte reusable by that job.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always

jobs:
  warm-cache:
    name: warm build cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install pinned Rust toolchain
        run: rustup show
      # `shared-key` (not `key`) so the cache is shared with the PR `build` job.
      # This workflow is the sole writer of the cache (default `save-if: true`).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-wheel
      # Output is discarded; we build only to populate the cargo registry and
      # `target/` dependency artifacts that rust-cache then saves.
      - name: Build abi3 wheel
        run: uvx maturin build --release --out dist

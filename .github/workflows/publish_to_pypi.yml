---
# This file is based on the autogenerated one by maturin v1.7.8 with:
#
#    maturin generate-ci github
#
# Differences are:
# - removed x86, armv7, s390x, ppc64le targets from Linux
# - removed free-threaded wheels
# - removed musllinux
# - have separate linux-just-test and linux-min-versions-just-test jobs running the
#   suite on the exact tagged commit (mirroring pull-request.yml's build/test steps).
#   This is the single test run of a release: pull-request.yml skips its build/test
#   jobs on the `bump-version` branch, so the suite is not paid twice
# - a `tag-on-main` guard job fails the run early when the tagged commit is not an
#   ancestor of main, so a tag pushed from an unmerged branch cannot publish
# - add the `RUSTFLAGS: "-Dwarnings"` env variable
# - `workflow_dispatch` runs the test and build jobs as a dry run; the release job is
#   tag-gated and never runs from a dispatch
# - release gates on the test jobs, generates GitHub build-provenance attestations, and
#   publishes via PyPI Trusted Publishing (OIDC) with PEP 740 attestations instead of an
#   API token + `maturin upload`


name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

# Make sure CI fails on any warning, including Clippy lints
env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  # A release tag must point into main's history: a tag pushed from an unmerged
  # branch would otherwise run the suite, pass, and publish a commit that never
  # lands on main (a squash merge rewrites the SHA, leaving the tag dangling).
  # `rev-parse HEAD^{commit}` peels annotated tags, where the event SHA can be
  # the tag object rather than the commit. On failure: delete the tag, merge the
  # PR, re-tag the merge commit on main.
  tag-on-main:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit is an ancestor of main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse 'HEAD^{commit}')" origin/main

  linux-just-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Set up Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true
      - name: Build abi3 wheel
        run: uvx maturin build --out dist
      - name: Sync project dependencies
        run: uv sync --group testing --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      # Both engines, as in pull-request.yml's `test-latest`, but as two steps: these jobs build the
      # crate themselves, so a second job would pay a second Rust build to re-run a one-minute
      # suite. `!cancelled()` still reports streaming when in-memory fails.
      - name: Run tests (in-memory engine)
        run: uv run --no-sync pytest tests
        env:
          POLARS_ENGINE_AFFINITY: in-memory
      - name: Run tests (streaming engine)
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest tests
        env:
          POLARS_ENGINE_AFFINITY: streaming

  # polars 1.15.0 predates `POLARS_ENGINE_AFFINITY` (see pull-request.yml's `test-oldest`).
  linux-min-versions-just-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Mirrors pull-request.yml's test-oldest: the polars floor is exercised on the
          # oldest python it publishes wheels for, not on the newest interpreter.
          python-version: "3.12"
          enable-cache: false
      - name: Set up Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true
      - name: Build abi3 wheel
        run: uvx maturin build --out dist
      - name: Sync project dependencies
        run: uv sync --group testing --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      - name: Pin polars to oldest supported version
        run: uv pip install "polars==1.15.0"
      - name: Run tests
        run: uv run --no-sync pytest tests

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: false
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [tag-on-main, linux-just-test, linux-min-versions-just-test, linux, windows, macos, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/polars-stats
    permissions:
      # Required by attest-build-provenance to read the workflow context
      contents: read
      # Used to sign the attestations (Sigstore) and to mint the OIDC token for
      # PyPI Trusted Publishing, no API token secret involved
      id-token: write
      # Used to persist the GitHub artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PEP 740 attestations are generated and uploaded by default with
          # Trusted Publishing; spelled out here so the intent survives upgrades.
          attestations: true
          skip-existing: true

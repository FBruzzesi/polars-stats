---

name: Pull Request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always
  DEFAULT_PYTHON_VERSION: "3.13"
  PYTHON_VERSIONS_LATEST: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
  PYTHON_VERSIONS_OLDEST: '["3.10", "3.11", "3.12"]'
  POLARS_OLDEST: "1.15.0"
  # The engines chunk a plugin's inputs differently: in-memory calls it once over the whole column,
  # streaming once per morsel. Neither broadcasts a length-1 input, so a plugin that zips rather
  # than broadcasts truncates under both, but at row counts that differ per engine. Each job pins
  # its engine, so polars 2 flipping the default to `streaming` leaves the in-memory arm on
  # in-memory.
  POLARS_ENGINES: '["in-memory", "streaming"]'

jobs:
  # `strategy.matrix` cannot read the workflow-level `env` context, so this
  # job re-publishes the version lists as job outputs. Downstream matrices
  # then read them via `needs.setup.outputs.*`, keeping `env:` above as the
  # single source of truth.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      python-versions-latest: ${{ env.PYTHON_VERSIONS_LATEST }}
      python-versions-oldest: ${{ env.PYTHON_VERSIONS_OLDEST }}
      polars-oldest: ${{ env.POLARS_OLDEST }}
      polars-engines: ${{ env.POLARS_ENGINES }}
    steps:
      - run: 'true'

  # NOTE: Rust lints stay in the dedicated `rust-lint` job (toolchain + cache concerns).
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: prek run
        run: uvx prek run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  # A `bump-version` release PR changes version strings only, so the expensive jobs
  # skip on it (the narwhals pattern): the full suite runs once per release, at tag
  # time, inside publish_to_pypi.yml on the exact release commit. `prek` still runs
  # (it is the cheap job that validates the bump itself, via the uv-lock hook).
  # Skipped required checks count as passing for branch protection.
  rust-lint:
    name: lint / cargo fmt + clippy
    if: github.head_ref != 'bump-version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      # fmt runs on nightly (rustfmt.toml uses unstable options); everything else,
      # clippy included, runs on the stable toolchain rust-toolchain.toml pins.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  # Build the extension once as an abi3 wheel. The `abi3-py39` pyo3 feature
  # means a single wheel runs on every CPython >= 3.9, so downstream
  # typing / test jobs just download and pip-install it.
  build:
    name: build wheel
    # Skipping this on `bump-version` also skips everything that needs it
    # (typing, test-latest, test-oldest, docs-strict-build).
    if: github.head_ref != 'bump-version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: build-wheel
      - name: Build abi3 wheel
        run: uvx maturin build --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  typing:
    name: typing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Sync project dependencies
        run: uv sync --group typing --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      - name: Show resolved dependencies
        run: uv export --no-annotate --no-hashes --group typing
      - name: pyrefly
        run: uv run --no-sync pyrefly check .
      - name: pyright
        run: uv run --no-sync pyright .
      - name: mypy
        run: uv run --no-sync mypy .

  test-latest:
    name: test-latest / py${{ matrix.python-version }} ${{ matrix.engine }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions-latest) }}
        engine: ${{ fromJSON(needs.setup.outputs.polars-engines) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Sync project dependencies
        run: uv sync --group testing --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      - name: Show resolved dependencies
        run: uv export --no-annotate --no-hashes --group testing
      - name: Run tests
        run: uv run --no-sync pytest tests
        env:
          POLARS_ENGINE_AFFINITY: ${{ matrix.engine }}

  # polars 1.15.0 predates `POLARS_ENGINE_AFFINITY`, `collect(engine=...)` defaults to `cpu`
  # and nothing reads the variable
  test-oldest:
    name: test-oldest / py${{ matrix.python-version }} polars-${{ needs.setup.outputs.polars-oldest }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions-oldest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Sync project dependencies
        run: uv sync --group testing --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      - name: Pin polars to oldest supported version
        run: uv pip install "polars==${NEEDS_SETUP_OUTPUTS_POLARS_OLDEST}"
        env:
          NEEDS_SETUP_OUTPUTS_POLARS_OLDEST: ${{ needs.setup.outputs.polars-oldest }}
      - name: Show resolved dependencies
        run: uv export --no-annotate --no-hashes --group testing
      - name: Run tests
        run: uv run --no-sync pytest tests

  docs-strict-build:
    name: docs-strict-build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Sync project dependencies
        run: uv sync --group docs --no-install-project
      - name: Install built wheel
        run: uv pip install dist/*.whl
      - name: Show resolved dependencies
        run: uv export --no-annotate --no-hashes --group docs
      - name: Zensical strict build
        run: uv run --no-sync zensical build --strict

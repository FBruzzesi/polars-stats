[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=1.15.0"]
build-backend = "maturin"

[project]
name = "polars-stats"
description = "Probability distributions in polars"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "Francesco Bruzzesi"}]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed"
]

dynamic = ["version"]
dependencies = [
    "polars>=1.15.0",
]

[tool.maturin]
module-name = "polars_stats._internal"

[[tool.mypy.overrides]]
module = "polars.utils.udfs"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]
testing = [
    "covdefaults>=2.3.0",
    "hypothesis>=6.100.0",
    "packaging>=26.2",
    "pytest>=8.3.5",
    "pytest-cov>=7.1.0",
]
# Routine 1: the CI regression guard (tests/benchmark/). pytest-codspeed measures instruction count under
# the CodSpeed runner in CI and falls back to local walltime measurement without it (`make bench-guard`).
# Always run alongside the `testing` group: the shared DistSpec registry needs hypothesis.
bench-guard = [
    "pytest-codspeed>=5.0.0",
]
# Routine 2 (manual scipy/numpy comparison report under benchmarks/): see `make bench-compare`.
bench-compare = [
    "cyclopts>=4.16.1",
    "psutil>=5.9",
    "rich>=15.0.0",
]
typing = [
    "mypy>=1.14.1",
    "pyrefly>=0.62.0",
    "pyright>=1.1.409",
    "scipy-stubs>=1.15.3.0",
    {include-group = "bench-compare"},
    {include-group = "bench-guard"},
    {include-group = "testing"},
]
docs = [
    "markdown-exec[ansi]>=1.12.1",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.43",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--cov",
  # Deselect the regression-guard benchmarks by default. They are still collected (imported), so API
  # drift in tests/benchmark/ fails any pytest run; `make bench-guard` overrides addopts to run them.
  "-m",
  "not benchmark",
]
# Registered here, not only by pytest-codspeed: the default test env does not install the plugin, and an
# unregistered mark would escalate to an error under `filterwarnings = error`.
markers = [
  "benchmark: regression-guard benchmark (tests/benchmark/), run via `make bench-guard`",
]
filterwarnings = [
  "error",
]
xfail_strict = true

[tool.coverage.run]
plugins = ["covdefaults"]
# Measure `polars_stats` as an installed package, not as the `./polars_stats` directory.
# In CI the package is imported from the built wheel in site-packages while the source tree sits in the checkout root;
# a directory-based source spec (`--cov=polars_stats`) would measure the never-executed checkout copy and report 0%.
# `source_pkgs` forces measurement of the imported location; `[coverage.paths]` below remaps it back onto the source
# tree so the report reads as `polars_stats/...`.
source_pkgs = ["polars_stats"]
source = ["tests"]

[tool.coverage.paths]
polars_stats = ["polars_stats", "*/site-packages/polars_stats"]

[tool.coverage.report]
fail_under = 95
omit = [
  "polars_stats/_typing.py",
]

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D100",  # Checks for undocumented public module definitions.
  "D104",  # Checks for undocumented public package definitions.
  "D107",  # Checks for public __init__ method definitions that are missing docstrings.
  "FIX002", # Line contains TODO, consider resolving the issue
  "TD003", # Missing issue link for this TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",
  "S101",
  "UP",
  "SLF",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true
pretty = true
strict = true
files = ["polars_stats", "tests"]

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.10"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportUnusedFunction = "none"
enableExperimentalFeatures = true
typeCheckingMode = "strict"
include = ["polars_stats", "tests"]

[tool.pyrefly]
project-includes = ["polars_stats", "tests"]
# Resolve first-party imports from the project root so module names match their full dotted path
# (`polars_stats.*`, `tests.*`), the same way mypy/pyright and pytest's importlib mode see them. Listing
# `polars_stats` / `tests` as roots instead would name `tests/property/_specs.py` as `property._specs`,
# so the cross-test `from tests.property._specs import ...` only resolves via the editable `.pth` on a
# local dev machine and breaks under CI's wheel-only install.
search_path = ["."]

[tool.rumdl]
line-length = 120
flavor = "mkdocs"
include = ["docs/**", "README.md", "AGENTS.md"]
disable = [
  # NOTE: These look like either false positives or unsupported case
  # TODO(FBruzzesi): Report upstream
  # No blank line after admonition block
  "MD031",
  # Use fenced code blocks
  "MD046",
]

[tool.rumdl.MD007]
# Keep list indentation consistent
indent = 4
start-indented = false

[tool.ryl.files]
yaml = ["*.yaml", "*.yml"]

[tool.ryl.rules.line-length]
max = 120
allow-non-breakable-words = true
allow-non-breakable-inline-mappings = true

[tool.ryl.rules.indentation]
spaces = 2
indent-sequences = true
check-multi-line-strings = false

[tool.ryl.rules.document-start]
present = true

[tool.ryl.rules.truthy]
allowed-values = ["true", "false"]
check-keys = false

[tool.ryl.rules.comments]
min-spaces-from-content = 1

[tool.ryl.rules.braces]
max-spaces-inside = 1

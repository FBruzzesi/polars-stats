---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.6'
    hooks:
      - id: ruff-format
        pass_filenames: false
      - id: ruff-check
        pass_filenames: false
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.10
    hooks:
      - id: uv-lock
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.69
    hooks:
      - id: rumdl
  - repo: https://github.com/owenlamont/ryl-pre-commit
    rev: v0.22.0
    hooks:
      - id: ryl
        args: [".", "--strict"]
  - repo: https://github.com/codespell-project/codespell
    rev: 'v2.4.3'
    hooks:
      - id: codespell
        files: \.(py|rst|md)$
  - repo: https://github.com/adhtruong/mirrors-typos
    # Use mirror to avoid autoupdate issue: https://github.com/crate-ci/typos/issues/390
    rev: 'v1.50.1'
    hooks:
      - id: typos
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: name-tests-test
        exclude: |
            (?x)^(
                tests/_polars_compat.py|
                tests/property/_specs.py|
                tests/scipy_parity/_harness.py
            )$
      - id: end-of-file-fixer
      - id: no-commit-to-branch
      - id: check-json
      - id: check-yaml
      - id: check-ast
      - id: check-added-large-files
